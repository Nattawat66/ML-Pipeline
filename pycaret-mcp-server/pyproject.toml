[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycaret-mcp-server"
version = "0.1.0"
description = "MCP Server for PyCaret datasets and operations"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "pycaret>=3.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
pycaret-mcp-server = "pycaret_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
